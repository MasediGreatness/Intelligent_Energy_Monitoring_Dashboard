name: intelligent-energy-dashboard

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: energy
      POSTGRES_USER: energy
      # Local scaffold only. Step 3 replaces this with validated secret-based config.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U energy -d energy"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: runtime
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://energy:@db:5432/energy
      APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY must be set}
      INGEST_API_KEY: ${INGEST_API_KEY:?INGEST_API_KEY must be set}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    volumes:
      - ../apps/api:/workspace/apps/api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: development
    environment:
      API_PROXY_TARGET: http://api:8000
      VITE_API_BASE_URL: ""
    volumes:
      - ../apps/web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:1.29-alpine
    profiles: ["proxy"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
      - web

volumes:
  postgres_data:
  web_node_modules:
